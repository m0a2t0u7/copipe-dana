name: Build APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  APP_NAME: copipe-dana
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Verify patched JavaScript Actions runtime
        id: node_runtime_guard
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, shlex, subprocess
          pid = os.getppid()
          root = None
          for _ in range(12):
              command = subprocess.check_output(['ps', '-p', str(pid), '-o', 'command='], text=True).strip()
              for argument in shlex.split(command):
                  if argument.endswith('/bin/Runner.Worker'):
                      root = pathlib.Path(argument).parent.parent
                      break
              if root:
                  break
              parent = subprocess.check_output(['ps', '-p', str(pid), '-o', 'ppid='], text=True).strip()
              if not parent or int(parent) <= 1:
                  break
              pid = int(parent)
          if root is None:
              raise SystemExit('::error::Cannot locate the active GitHub Actions runner; refusing unchecked JavaScript Actions.')
          node = root / 'externals' / 'node24' / 'bin' / 'node'
          if not node.is_file():
              raise SystemExit('::error::Runner has no Node.js 24 runtime. Upgrade runner to v2.338.1 or newer.')
          version = subprocess.check_output([str(node), '--version'], text=True).strip()
          parts = tuple(map(int, version.lstrip('v').split('.')))
          if not ((24, 22, 1) <= parts < (25, 0, 0)):
              raise SystemExit('::error::Unpatched Actions runtime ' + version + '; require Node.js 24.22.1 or newer in the 24.x line.')
          print('Verified Actions runtime ' + version)
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      # 署名はリポジトリ内の固定鍵 app/copipecho.jks（上書きインストールのため変更しない）
      - run: gradle :app:assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk "$APP_NAME.apk"
      - name: Publish latest release
        if: ${{ false }} # Preserve existing releases during security remediation
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest "$APP_NAME.apk" --title "最新版 (${GITHUB_SHA::7})" --notes "自動ビルド ${GITHUB_SHA::7}" --latest
      - name: Upload to Google Drive
        if: ${{ false }} # Disable external delivery during security remediation
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_KEY: ${{ secrets.GAS_KEY }}
        run: |
          if [ -z "$GAS_URL" ] || [ -z "$GAS_KEY" ]; then echo "Drive保存をスキップ（Secrets未登録）"; exit 0; fi
          base64 -w0 "$APP_NAME.apk" > apk.b64
          curl -sSL --fail -X POST -H "Content-Type: text/plain" --data-binary @apk.b64 \
            "$GAS_URL?key=$GAS_KEY&app=$APP_NAME&ver=${GITHUB_SHA::7}" | tee result.json
          grep -q '"ok":true' result.json
